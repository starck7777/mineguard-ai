services:
  - type: web
    name: mineguard-ai
    runtime: python
    repo: https://github.com/starck7777/mineguard-ai
    region: singapore
    plan: free
    branch: main
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mineguard-ai-db
          property: connectionString
      - key: MINEGUARD_ADMIN_TOKEN
        generateValue: true
      - key: MQTT_ENABLED
        value: false
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: NODE_VERSION
        value: 20.18.1

databases:
  - name: mineguard-ai-db
    region: singapore
    plan: free
    databaseName: mineguard_ai
    user: mineguard_ai
